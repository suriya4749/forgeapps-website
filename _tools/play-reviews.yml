name: Fetch Google Play reviews

on:
  schedule:
    - cron: '17 3 * * *'   # every day, 08:47 in India
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - name: Fetch reviews
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python _tools/play_reviews.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/reviews.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add assets/reviews.json
            git commit -m "Update Google Play reviews"
            git push
          fi
